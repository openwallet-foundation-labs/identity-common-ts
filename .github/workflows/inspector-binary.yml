name: Inspector executable

# Builds the command line tool of @owf/eudi-inspector as a single executable for Linux,
# with Node.js single executable applications (SEA). The release workflow calls it to attach
# the executable to the GitHub release of the @owf/eudi-* packages.

on:
  push:
    branches:
      - main
    paths:
      - packages/eudi-inspector/**
      - packages/*/src/**
      - pnpm-lock.yaml
      - .github/workflows/inspector-binary.yml
  pull_request:
    paths:
      - packages/eudi-inspector/**
      - .github/workflows/inspector-binary.yml
  workflow_dispatch:
  workflow_call:
    inputs:
      release-tag:
        description: Tag of the GitHub release to attach the executable to
        type: string
        required: false

permissions:
  contents: read

env:
  ASSET: eudi-inspect-linux-x64

jobs:
  build:
    runs-on: ubuntu-24.04
    name: Build for Linux x64
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup NodeJS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Building a single executable needs Node.js 25.7 or later
          node-version: 26
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the executable
        run: pnpm --filter @owf/eudi-inspector build:binary

      - name: Check the executable
        run: |
          binary=packages/eudi-inspector/dist-binary/eudi-inspect
          $binary --version
          # A signed trusted list, which also runs the XML signature verification
          node -e "import('./packages/eudi-tl/src/__tests__/fixtures.mts').then((m) => process.stdout.write(m.SIGNED_TSL_XML))" \
            | $binary -

      - name: Upload the executable
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ASSET }}
          path: packages/eudi-inspector/dist-binary/eudi-inspect

  attach:
    runs-on: ubuntu-24.04
    name: Attach to the release
    needs: build
    if: inputs.release-tag
    permissions:
      contents: write # Upload the release asset
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.release-tag }}
    steps:
      - name: Download the executable
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.ASSET }}
          path: download

      - name: Attach the executable and its checksum
        run: |
          # Once per version, so a later release of other packages does not replace it
          if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx "$ASSET"; then
            echo "$TAG already has $ASSET"
            exit 0
          fi
          mv download/eudi-inspect "$ASSET"
          sha256sum "$ASSET" > "$ASSET.sha256"
          gh release upload "$TAG" "$ASSET" "$ASSET.sha256"

name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - docs/sd-jwt/**
      - packages/sd-jwt-vc/docs/**
      # The inspector and the packages it bundles
      - apps/inspector/**
      - packages/identity-common/src/**
      - packages/crypto/src/**
      - packages/x509/src/**
      - packages/eudi-*/src/**
      - packages/token-status-list/src/**
      - packages/cose/src/**
      - pnpm-lock.yaml
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, but do not cancel in-progress deployments
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    name: Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup NodeJS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build inspector
        run: pnpm --filter identity-inspector build

      # Keep the guides available under their previous sdjwt.js.org/0.x/ URLs
      - name: Assemble site
        run: |
          mkdir -p _site/0.x _site/inspector
          cp -r docs/sd-jwt/. _site/
          cp packages/sd-jwt-vc/docs/*.md _site/0.x/
          cp -r apps/inspector/dist/. _site/inspector/

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
